x-coverage:
  state: covered
  reason: covered
  detail: >-
    McMaster operates a real, public, institution-owned API surface. experts.mcmaster.ca answers
    anonymously across three confirmed operations and is documented here from live probes; MacSphere
    is a self-hosted DSpace 8.2 repository with conformant OAI-PMH on McMaster's own domain; and
    sso.mcmaster.ca publishes McMaster's own Shibboleth IdP metadata into the Canadian Access
    Federation and eduGAIN. Five of the twelve education-regime domain standards are met with live
    evidence: oai-pmh, shibboleth, saml, datacite and crossref.


    Coverage is not complete, and the reason is McMaster's rather than ours. The central Azure API
    Management portal at developer.api.mcmaster.ca gates both its API catalog and its product list
    behind MacID sign-in, so an internal API estate demonstrably exists and cannot be measured from
    outside. The Experts API is undocumented — no OpenAPI, no terms, no rate limit, and a bad
    parameter returns 500 rather than 400. The course catalog runs on a Modern Campus deployment with
    no API. No status page, llms.txt or security.txt exists; the three URLs that appeared to serve
    them all resolve to a homepage.
