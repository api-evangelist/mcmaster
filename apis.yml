    description: >-
      Public, unauthenticated JSON API behind McMaster Experts, the university's researcher and
      expertise discovery gateway. Three operations confirmed by live probe on 2026-09-01: a
      cross-entity keyword search over people, groups, labels and publications; a directory listing of
