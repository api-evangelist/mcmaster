  - aid: mcmaster:shibboleth-idp
    name: McMaster University Shibboleth Identity Provider
    x-operator: federation
    x-operator-evidence: >-
      entityID https://sso.mcmaster.ca/idp/shibboleth, shibmd:Scope mcmaster.ca, registration
      authority http://www.canarie.ca (Canadian Access Federation), published into eduGAIN and first
      seen there 2017-11-28. A federation is shared by definition; the IdP behind it is McMaster's.
    description: >-
      McMaster's own SAML 2.0 Identity Provider, the authentication authority behind MacID. Publishes
      machine-readable SAML metadata anonymously at its entityID, carrying an IDPSSODescriptor, an
      AttributeAuthorityDescriptor, a UIInfo display name and description, and the scope mcmaster.ca
      that bounds every scoped attribute the IdP may assert. Registered in the Canadian Access
      Federation by CANARIE and republished into eduGAIN, with SIRTFI asserted. This is an
      institution-operated, standards-conformant, machine-readable surface, and it satisfies both the
      shibboleth and saml domain standards of the Kin Score education regime.
    humanURL: https://uts.mcmaster.ca/
    baseURL: https://sso.mcmaster.ca/idp/shibboleth
