aid: mcmaster
name: McMaster University
x-type: university
x-category: Public Research University
description: >-
  McMaster University is a public research university in Hamilton, Ontario, Canada. Its programmable
  footprint is small but genuinely its own, and it is larger than a June 2026 pass concluded. McMaster
  operates an undocumented but fully public JSON API behind McMaster Experts, its researcher and
  expertise discovery gateway at experts.mcmaster.ca — a bespoke application, not a vendor
  research-information system — answering anonymously across 7,301 directory records and 273,828
  scholarly works. It self-hosts MacSphere, a DSpace 8.2 institutional repository of 26,361 items with
  a conformant OAI-PMH 2.0 interface on its own domain. It operates its own Shibboleth Identity
  Provider, published into eduGAIN through the Canadian Access Federation, which is the strongest
  machine-readable surface most universities have and the one this cohort was most completely missing.
  It runs a central Azure API Management developer portal at developer.api.mcmaster.ca, but that portal
  is gated behind MacID sign-in and a registration step: neither the API catalog nor the product list
  can be read without an institutional account, so the size of McMaster's actual internal API estate is
  unknown from outside. Beyond what it operates, McMaster holds real relationships on platforms it does
  not run — a named collection on the Borealis Dataverse, DataCite provider registration, and Crossref
  membership under McMaster University Library's own DOI prefix. Those are facts about McMaster; the
  contracts belong to the platforms. McMaster publishes no status page, no llms.txt, no security.txt,
  no API terms of use and no rate-limit statement, and its course catalog exists only as a human
  surface on a Modern Campus deployment with no API.
