  - aid: mcmaster:macsphere
    name: MacSphere Institutional Repository
    x-operator: institution
    x-operator-evidence: >-
      macsphere.mcmaster.ca resolves to prod-ms-be.lib.mcmaster.ca — both under mcmaster.ca. The
      repository is self-hosted by McMaster University Libraries, not a hosted vendor tenancy.
    description: >-
      McMaster University Libraries' institutional repository of theses, dissertations and open-access
      research outputs. DSpace 8.2, self-hosted, holding 26,361 items with an earliest datestamp of
      2014-06-17. Exposes a conformant OAI-PMH 2.0 interface offering twelve metadata formats
      (oai_dc, qdc, dim, mods, mets, didl, ore, xoai, rdf, marc, rioxx, uketd_dc) and the DSpace REST
      API for anonymous read.


      NO CONTRACT IS SAVED FOR THIS SURFACE, deliberately. McMaster runs the deployment, but the REST
      API is DSpace's generic contract shipped by every DSpace institution; saving it here would
      credit McMaster with DSpace's engineering. The deployment is the institutional fact and that is
      what is recorded.
    humanURL: https://macsphere.mcmaster.ca/
